<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SWAMP FOG CASHIER Ver.40</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
#loading{height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#222}
</style>
</head>
<body>
<div id="loading">SWAMP FOG CASHIER Ver.40 読み込み中…</div>
<script>
(async()=>{
  try{
    const sourceUrl="https://raw.githubusercontent.com/SWAMPFOG/fog-cashier/2e75a08f27775fa5d3c5e1b2b574928509dc09dc/index.html";
    const res=await fetch(sourceUrl,{cache:"no-store"});
    if(!res.ok)throw new Error("本体取得 "+res.status);
    let html=await res.text();

    const replaceOnce=(from,to)=>{
      if(!html.includes(from))throw new Error("更新箇所が見つかりません");
      html=html.replace(from,to);
    };

    replaceOnce('<meta name="fog-cashier-version" content="38">','<meta name="fog-cashier-version" content="40">');
    replaceOnce('<title>SWAMP FOG CASHIER v38 REALTIME</title>','<title>SWAMP FOG CASHIER v40 REALTIME</title>');
    replaceOnce('<span class="app-ver">Ver.38</span>','<span class="app-ver">Ver.40</span>');
    replaceOnce('const APP_VERSION="38";','const APP_VERSION="40";');
    if(html.includes('alt="SWAMP FOG 卓表 Ver.38"'))html=html.replace('alt="SWAMP FOG 卓表 Ver.38"','alt="SWAMP FOG 卓表 Ver.40"');

    // Ver.40: 元の卓配置・機能は一切変更せず、右上の区分表示だけを修正。
    const cssAnchor='.hotspot{\n  transform:none;\n}\n';
    const css=`
/* Ver.40 customer legend - preserve original floor layout */
.color-legend-v40{
  position:absolute;
  left:74.810606%;
  top:11.220196%;
  width:21.401515%;
  height:24.684432%;
  z-index:3;
  box-sizing:border-box;
  display:grid;
  grid-template-rows:repeat(8,1fr);
  gap:1.8%;
  padding:3.4% 10.5%;
  background:#fff;
  border:1.5px solid #9a9a9a;
  border-radius:34% / 18%;
  pointer-events:none;
  user-select:none;
}
.color-legend-v40 .lg{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:0;
  border-radius:999px;
  color:#111;
  font-size:clamp(6px,.72vw,11px);
  font-weight:800;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
}
.color-legend-v40 .orange{background:#ff9b6a}
.color-legend-v40 .pink{background:#f58bc6}
.color-legend-v40 .green{background:#a9e58f}
.color-legend-v40 .blue{background:#89dde5}
.color-legend-v40 .purple{background:#9c73e8}
.color-legend-v40 .yellow{background:#ffe497}
.color-legend-v40 .red{background:#ff7070}
.color-legend-v40 .gray{background:#777;color:#fff}
`;
    if(!html.includes(cssAnchor))throw new Error("区分表示の設定位置が見つかりません");
    html=html.replace(cssAnchor,cssAnchor+css);

    const legend=`        <div class="color-legend-v40" aria-hidden="true">
          <div class="lg orange">ご新規様お連れ様</div>
          <div class="lg pink">初回指名 リピート</div>
          <div class="lg green">場内指名</div>
          <div class="lg blue">2リピ</div>
          <div class="lg purple">クイック</div>
          <div class="lg yellow">光アイスペール</div>
          <div class="lg red">ゴールドカード</div>
          <div class="lg gray">ブラックカード</div>
        </div>\n`;
    const firstHotspot='        <button class="hotspot"';
    if(!html.includes(firstHotspot))throw new Error("卓表位置が見つかりません");
    html=html.replace(firstHotspot,legend+firstHotspot);

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.getElementById("loading").textContent="読み込みエラー："+e.message;
  }
})();
</script>
</body>
</html>
