<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="fog-cashier-version" content="31">
<title>SWAMP FOG CASHIER v31 REALTIME</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efefec;color:#111;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:grid;grid-template-rows:56px 1fr 60px}
.top{display:flex;align-items:center;gap:8px;padding:0 10px;background:#fff;border-bottom:1px solid #d5d5cf}
.brand{font-weight:900;letter-spacing:.04em;white-space:nowrap;font-size:13px}
.app-ver{font-size:9px;color:#777;font-weight:800;letter-spacing:0;margin-left:4px}
.tabs{display:flex;gap:5px;flex:1;justify-content:center}
.tab{border:1px solid #c9c9c3;background:#fff;padding:9px 18px;border-radius:10px;font-weight:850;color:#555}
.tab.active{background:#111;color:#fff;border-color:#111}
.meta{font-size:12px;color:#666;white-space:nowrap}

.meta{display:flex;align-items:center;gap:7px}
.sync-pill{
  border:1px solid #c9c9c3;
  background:#f8f8f5;
  color:#666;
  border-radius:999px;
  padding:4px 7px;
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
}
.sync-pill.ok{background:#eef8ef;color:#1c6b2a;border-color:#b8d9bd}
.sync-pill.busy{background:#fff7e2;color:#8a6100;border-color:#e2cf96}
.sync-pill.error{background:#fff0f0;color:#a01818;border-color:#e2b5b5}

.sync-login{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(243,243,240,.98);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.sync-login.open{display:flex}
.sync-login-card{
  width:min(430px,94vw);
  background:#fff;
  border:1px solid #c9c9c3;
  border-radius:16px;
  padding:20px;
  box-shadow:0 18px 45px rgba(0,0,0,.12);
}
.sync-login-card h2{margin:0 0 5px;font-size:20px}
.sync-login-card p{margin:0 0 16px;color:#666;font-size:12px;line-height:1.6}
.sync-login-fields{display:grid;gap:10px}
.sync-login-error{min-height:18px;margin-top:8px;color:#b00020;font-size:11px;font-weight:800}

.screen{display:none;min-height:0}
.screen.active{display:block}

.board-screen{height:100%;padding:8px;background:#f3f3f0}
.board-wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.floor{
  position:relative;
  width:100%;
  height:auto;
  max-height:100%;
  aspect-ratio:1076/1522;
  background:#fff;
  box-shadow:0 0 0 1px #d6d6d0;
}
.floor>img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  pointer-events:none;
  user-select:none;
}
@media (orientation:landscape){
  .floor{
    width:auto;
    height:100%;
    max-width:100%;
  }
}
.hotspot{
  position:absolute;
  padding:0;
  overflow:hidden;
  background:#fff;
  border:1.4px solid #111;
  z-index:2;
  transform-origin:center center;
}
.hotspot::before{
  content:attr(data-display);
  position:absolute;
  left:3px;
  top:2px;
  z-index:5;
  font-size:clamp(7px,.72vw,10px);
  font-weight:700;
  line-height:1;
  color:#111;
  pointer-events:none;
}
.hotspot:active{background:#f7f7f5}

/* 枠を大型化。配置そのものは維持 */
.hotspot[data-table^="A"],
.hotspot[data-table^="B"]{
  transform:scaleX(1.04) scaleY(1.12);
}
.hotspot[data-table^="C"]{
  transform:scaleX(1.025) scaleY(1.10);
}
.hotspot[data-table^="D"]{
  transform:scaleX(1.06) scaleY(1.12);
}
.hotspot[data-table^="S"]{
  transform:scaleX(1.07) scaleY(1.12);
}
.hotspot[data-table="VIP"],
.hotspot[data-table="RVIP"]{
  transform:none;
}

.overlay{
  position:absolute;
  left:3px;
  right:3px;
  top:15%;
  bottom:3px;
  padding:0;
  pointer-events:none;
  overflow:hidden;
  background:transparent;
}
.overlay.occupied,.overlay.check,.overlay.cleaning{
  background:rgba(255,255,255,.97);
}
.names-block{
  position:absolute;
  left:4px;
  right:4px;
  top:1px;
  height:58%;
  overflow:hidden;
}
.cast-line,.client-line{
  position:absolute;
  left:0;
  right:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#111;
  line-height:1.05;
}
.cast-line{
  top:0;
  font-weight:650;
  font-size:clamp(7.5px,.90vw,12.5px);
}
.client-line{
  top:46%;
  width:max-content;
  max-width:100%;
  font-weight:600;
  font-size:clamp(7px,.82vw,11.5px);
  padding:2px 5px;
  border-radius:999px;
}
.client-line.t-gray{color:#fff}
.table-meta{
  position:absolute;
  left:4px;
  right:4px;
  bottom:1px;
  height:27%;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:4px;
  overflow:hidden;
}
.ov-time{
  min-width:0;
  color:#333;
  font-weight:600;
  font-size:clamp(7px,.75vw,10px);
  line-height:1;
  white-space:nowrap;
  flex:1 1 auto;
  padding-bottom:1px;
}
.crown{
  flex:0 0 auto;
  font-size:clamp(15px,1.55vw,22px);
  line-height:1;
}

.client-list-line{
  position:absolute;
  left:0;
  right:0;
  top:46%;
  display:flex;
  gap:3px;
  align-items:center;
  overflow:hidden;
  white-space:nowrap;
}
.client-chip{
  display:inline-block;
  min-width:0;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-weight:600;
  font-size:clamp(7px,.82vw,11.5px);
  line-height:1.05;
  padding:2px 5px;
  border-radius:999px;
  color:#111;
}
.client-chip.t-gray{color:#fff}
.quick-register{
  display:none;
  margin-top:8px;
  padding:10px;
  border:1px solid #d5d5cf;
  border-radius:10px;
  background:#fafaf8;
}
.quick-register.open{display:grid;gap:8px}
.quick-register-row{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:7px;
  align-items:end;
}
.quick-register-row .btn{padding:9px 10px}
.dynamic-list{
  display:grid;
  gap:7px;
}
.dynamic-row{
  display:flex;
  gap:7px;
  align-items:center;
}
.dynamic-row select{
  flex:1 1 auto;
  min-width:0;
}
.add-one{
  border:1px solid #bdbdb7;
  background:#f7f7f4;
  border-radius:8px;
  padding:8px 10px;
  font-size:12px;
  font-weight:800;
}
.remove-one{
  width:34px;
  height:34px;
  border:1px solid #d3d3ce;
  background:#fff;
  border-radius:8px;
  font-weight:900;
  flex:0 0 auto;
}
.t-orange{background:#ffb37e} .t-pink{background:#f59ac9} .t-green{background:#a8e995}
.t-blue{background:#8fe0e7} .t-purple{background:#b38aeb} .t-yellow{background:#ffe89d}
.t-red{background:#ff7777} .t-gray{background:#9a9a9a;color:#fff}
.bigx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,4vw,60px);font-weight:300;color:#d11}
.cleantext{font-weight:900;font-size:clamp(8px,1vw,14px)}

.schedule-screen{height:100%;padding:10px;background:#f3f3f0;overflow:auto}
.schedule-card{background:#fff;border:1px solid #d0d0ca;border-radius:14px;padding:12px;min-height:100%}
.schedule-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.schedule-head h2{margin:0;font-size:18px}
.schedule-grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:10px;overflow-x:auto}
.schedule-col{border:1px solid #d7d7d1;border-radius:12px;overflow:hidden;background:#fff}
.schedule-title{padding:10px 12px;font-weight:900;background:#f6f6f3;border-bottom:1px solid #d7d7d1}
.reserve{padding:10px 12px;border-bottom:1px solid #ecece8}
.reserve:last-child{border-bottom:0}
.reserve-top{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#666}
.reserve-main{font-weight:900;margin-top:3px}
.reserve-sub{font-size:12px;color:#555;margin-top:2px}
.reserve-actions{display:flex;gap:6px;margin-top:7px}
.empty{padding:14px;color:#888;font-size:12px}

.bottom{display:flex;align-items:center;gap:7px;padding:7px 10px;background:#fff;border-top:1px solid #d5d5cf}
.btn{border:1px solid #c7c7c1;background:#fff;border-radius:9px;padding:9px 12px;font-weight:800}
.btn.primary{background:#111;color:#fff;border-color:#111}
.spacer{flex:1}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal.open{display:flex}
.card{width:min(560px,94vw);max-height:90vh;overflow:auto;background:#fff;border:1px solid #bbb;border-radius:14px;padding:18px;box-shadow:0 18px 45px rgba(0,0,0,.18)}
.card h3{margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:5px}
.field.full{grid-column:1/-1}
label{font-size:11px;color:#666;font-weight:800}
input,select{width:100%;border:1px solid #bdbdb7;background:#fff;border-radius:8px;padding:10px;color:#111}
.checks{display:flex;flex-wrap:wrap;gap:7px}
.ck{display:flex;align-items:center;gap:5px;border:1px solid #ccc;border-radius:999px;padding:6px 8px;font-size:11px;background:#fafaf8}
.ck input{width:auto}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.action{border:1px solid #c9c9c3;background:#fafaf8;border-radius:9px;padding:12px 8px;font-weight:800}
.action.primary{background:#111;color:#fff;border-color:#111}
.action.danger{color:#b00020}
.card-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.mini{border:1px solid #c8c8c2;background:#fff;border-radius:7px;padding:6px 8px;font-size:11px;font-weight:800}
.mini.primary{background:#111;color:#fff;border-color:#111}

.table-number-move{
  display:inline-block;
  border:1px solid #111;
  background:#111;
  color:#fff;
  border-radius:9px;
  padding:7px 13px;
  font-size:18px;
  font-weight:950;
  letter-spacing:.03em;
}
.move-history{
  margin-top:8px;
  padding:8px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:12px;
  line-height:1.65;
}
.move-history b{font-weight:900}

.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.18s;background:#111;color:#fff;padding:9px 14px;border-radius:999px;font-size:12px;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Same layout in portrait and landscape: only scale changes */
@media (orientation:portrait){
  .app{grid-template-rows:54px 1fr 58px}
  .brand{font-size:11px}
  .tab{padding:8px 14px}
  .meta{font-size:11px}
  .bottom .btn{font-size:11px;padding:8px 9px}
  .schedule-grid{grid-template-columns:repeat(3,minmax(180px,1fr))}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body>
<div class="sync-login" id="syncLogin">
  <div class="sync-login-card">
    <h2>FOG CASHIER</h2>
    <p>店内リアルタイム共有にログイン</p>
    <div class="sync-login-fields">
      <div class="field">
        <label>メールアドレス</label>
        <input id="syncEmail" type="email" autocomplete="username" placeholder="cashier@example.com">
      </div>
      <div class="field">
        <label>パスワード</label>
        <input id="syncPassword" type="password" autocomplete="current-password" placeholder="Password">
      </div>
      <button class="btn primary" type="button" onclick="cashierLogin()">ログイン</button>
    </div>
    <div class="sync-login-error" id="syncLoginError"></div>
  </div>
</div>

function uid(p){return p+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)}
function nowHHMM(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function normalizeBusinessTime(value){
  if(!value)return "";
  const m=String(value).match(/^(\d{1,2}):(\d{2})$/);
  if(!m)return value;
  let h=Number(m[1]),min=Number(m[2]);
  if(h===0)h=24;
  else if(h===1)h=25;
  const total=h*60+min;
  if(total<20*60)return "20:00";
  if(total>25*60)return "25:00";
  return String(h).padStart(2,"0")+":"+String(min).padStart(2,"0")
}
function nowBusinessHHMM(){
  const d=new Date();
  let h=d.getHours(),m=d.getMinutes();
  if(h===0)h=24;
  else if(h===1)h=25;
  const total=h*60+m;
  if(total<20*60||total>25*60)return "20:00";
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")
}
function businessTimeOptions(selected=""){
  const sel=normalizeBusinessTime(selected||nowBusinessHHMM());
  let html="";
  for(let total=20*60;total<=25*60;total++){
    const h=Math.floor(total/60),m=total%60;
    const v=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
    html+=`<option value="${v}" ${v===sel?"selected":""}>${v}</option>`
  }
  return html
}

function yen(v){

}
const NEW_PLAN_PRICES={
  A:{normal:1000,campaign:0},
  B:{normal:3000,campaign:2000},
  VIP:{normal:10000,campaign:9000}
};
const FIELD_PLANS=[10000,15000,100000,300000,1000000];
function fieldPlanOptions(selected=""){

}
function addMinutesHHMM(hhmm,mins){
  if(!hhmm)return "";
  const [h,m]=hhmm.split(":").map(Number);

  return String(Math.floor(total/60)).padStart(2,"0")+":"+String(total%60).padStart(2,"0")
}

}

  return campaign?p.campaign:p.normal
}

  const campaign=!!document.getElementById(prefix+"NewCampaign")?.checked;
  const amount=calcNewAmount(plan,campaign);
  const out=document.getElementById(prefix+"NewAmount");
  if(out)out.value=amount
}
const CATEGORY_DEFS={
  none:{label:"色なし",short:"",cls:""},
  new:{label:"ご新規様",short:"ご新規様",cls:"t-orange"},
  companion:{label:"お連れ様",short:"お連れ様",cls:"t-orange"},
  pink:{label:"初回指名 / リピート",short:"初回/リピ",cls:"t-pink"},
  green:{label:"場内指名",short:"場内",cls:"t-green"},
  blue:{label:"2リピ",short:"2リピ",cls:"t-blue"},
  purple:{label:"クイック",short:"Q",cls:"t-purple"},
  yellow:{label:"光アイスペール",short:"光",cls:"t-yellow"},
  red:{label:"ゴールドカード",short:"G",cls:"t-red"},
  gray:{label:"ブラックカード",short:"B",cls:"t-gray"}
};

function categoryOptions(selected="none"){
  return Object.entries(CATEGORY_DEFS).map(([value,d])=>
    `<option value="${value}" ${value===selected?"selected":""}>${esc(d.label)}</option>`
  ).join("")
}
function legacyCategory(s){
  if(s.category&&CATEGORY_DEFS[s.category])return s.category;
  if(s.black)return "gray";
  if(s.gold)return "red";
  if(s.glow)return "yellow";
  if(s.quick)return "purple";
  if(s.classification==="repeat2")return "blue";
  if(s.classification==="first"||s.classification==="repeat")return "pink";
  return sessionType(s)==="new"?"new":"none"
}
function sessionType(s){
  if(["new","existing","industry","trial"].includes(s.baseType))return s.baseType;
  if(["new","industry","trial"].includes(s.type))return s.type;
  return "existing"
}
function getFieldAssignments(s){
  if(Array.isArray(s.fieldAssignments))return s.fieldAssignments;

  // v20以前の場内データを表示できるように最低限引き継ぐ
  if((s.type==="field"||s.fieldPlan)&&s.fieldPlan){
    const castId=(Array.isArray(s.castIds)&&s.castIds[0])||s.castId||"";
    return [{
      id:"legacy_field",
      castId,
      plan:Number(s.fieldPlan||0),
      startTime:s.fieldStartTime||"",
      nextCheckTime:s.fieldNextCheckTime||""
    }]
  }
  return []
}
function fieldCapacity(s){
  const type=sessionType(s);
  if(type==="new")return Math.max(1,Number(s.newGuestCount||1));
  if(type==="existing")return Math.max(0,Number(s.companionCount ?? (Array.isArray(s.companionFees)?s.companionFees.length:0)));
  return 0
}
function fieldCount(s){return getFieldAssignments(s).length}
function remainingFieldSlots(s){return Math.max(0,fieldCapacity(s)-fieldCount(s))}
function sessionCastIds(s){
  const ids=[];
  const baseIds=Array.isArray(s.castIds)?s.castIds.filter(Boolean):[];
  baseIds.forEach(id=>{if(!ids.includes(id))ids.push(id)});
  if(s.castId&&!ids.includes(s.castId))ids.push(s.castId);
  if(s.castId2&&!ids.includes(s.castId2))ids.push(s.castId2);

  getFieldAssignments(s).forEach(a=>{
    if(a.castId&&!ids.includes(a.castId))ids.push(a.castId)
  });
  return ids
}
function sessionClientIds(s){
  if(Array.isArray(s.clientIds))return s.clientIds.filter(id=>id&&id!=="__companion__");
  const ids=[];
  if(s.clientId)ids.push(s.clientId);
  if(s.clientId2&&!ids.includes(s.clientId2))ids.push(s.clientId2);
  return ids
}
function sessionCastNames(s){
  const names=sessionCastIds(s).map(id=>castById(id)?.name).filter(Boolean);
  if(!names.length){
    [s.castName,s.castName2].filter(Boolean).forEach(n=>{
      if(!names.includes(n))names.push(n)
    })
  }
  return names
}
function sessionClientEntries(s){
  const type=sessionType(s);
  const fields=fieldCount(s);
  const entries=[];

  if(type==="trial"){
    return [{name:"体験",category:"none"}]
  }

  if(type==="industry"){
    return [{name:"同業",category:"none"}]
  }

  if(type==="new"){
    const total=Math.max(1,Number(s.newGuestCount||1));
    const remaining=Math.max(0,total-fields);
    if(remaining>0)entries.push({
      name:"ご新規様"+(total>1?"×"+remaining:""),
      category:"new"
    });
    if(fields>0)entries.push({
      name:"場内"+(fields>1?"×"+fields:""),
      category:"green"
    });
    return entries
  }

  const regularCategory=legacyCategory(s);
  const ids=sessionClientIds(s);
  ids.forEach(id=>{
    const c=clientById(id);
    if(c)entries.push({name:c.name,category:regularCategory})
  });

  if(!entries.length){
    [s.clientName,s.clientName2].filter(Boolean).forEach(n=>{
      if(!entries.some(x=>x.name===n))entries.push({name:n,category:regularCategory})
    })
  }

  const totalComp=Math.max(0,Number(s.companionCount ?? (Array.isArray(s.companionFees)?s.companionFees.length:0)));
  const remainingComp=Math.max(0,totalComp-fields);
  if(remainingComp>0){
    entries.push({
      name:"お連れ様"+(totalComp>1?"×"+remainingComp:""),
      category:"companion"
    })
  }
  if(fields>0){
    entries.push({
      name:"場内"+(fields>1?"×"+fields:""),
      category:"green"
    })
  }
  return entries
}
function sessionClientNames(s){
  return sessionClientEntries(s).map(x=>x.name)
}

function deepClone(v){
  return JSON.parse(JSON.stringify(v))
}
function sameJSON(a,b){
  return JSON.stringify(a)===JSON.stringify(b)
}
function syncPayload(source=db){
  return {
    initialized:true,
    casts:deepClone(source.casts||[]),
    clients:deepClone(source.clients||[]),
    staff:deepClone(source.staff||[]),
    reservations:deepClone(source.reservations||[]),
    tables:deepClone(source.tables||{})
  }
}

         (db.clients?.length||0)>0 ||

function syncErrorText(error){
  if(!error)return "不明なエラー";
  const parts=[
    error.message,
    error.details,
    error.hint,
    error.code,
    error.status
  ].filter(Boolean);
  return parts.join(" / ")||String(error)
}

function applyRemotePayload(payload){
  if(!payload||payload.initialized===false)return;

  const localHistory=db.history||[];
  const incoming=Object.assign(defaultDB(),{
    casts:deepClone(payload.casts||[]),
    clients:deepClone(payload.clients||[]),
    staff:deepClone(payload.staff||defaultDB().staff),
    reservations:deepClone(payload.reservations||[]),
    tables:deepClone(payload.tables||{})
  });
  incoming.history=localHistory;
  db=incoming;

  persistLocalOnly();
  renderAll()
}
function mapById(arr){
  const m=new Map();
  (arr||[]).forEach(x=>{if(x?.id)m.set(x.id,deepClone(x))});
  return m
}
function mergeIdArray(baseArr,localArr,remoteArr){
  const base=mapById(baseArr);
  const local=mapById(localArr);
  const remote=mapById(remoteArr);

  const touched=new Set([...base.keys(),...local.keys()]);
  touched.forEach(id=>{
    const b=base.get(id);
    const l=local.get(id);

    if(b&&!l){
      remote.delete(id);
      return
    }
    if(!b&&l){
      remote.set(id,deepClone(l));
      return
    }
    if(b&&l&&!sameJSON(b,l)){
      remote.set(id,deepClone(l))
    }
  });

  const remoteOrder=(remoteArr||[]).map(x=>x?.id).filter(id=>remote.has(id));
  const extra=[...remote.keys()].filter(id=>!remoteOrder.includes(id));
  return [...remoteOrder,...extra].map(id=>remote.get(id))
}
function mergeTables(baseTables,localTables,remoteTables){
  const base=baseTables||{};
  const local=localTables||{};
  const remote=deepClone(remoteTables||{});
  const keys=new Set([...Object.keys(base),...Object.keys(local)]);

  keys.forEach(k=>{
    const hasB=Object.prototype.hasOwnProperty.call(base,k);
    const hasL=Object.prototype.hasOwnProperty.call(local,k);

    if(hasB&&!hasL){
      delete remote[k];
      return
    }
    if(!hasB&&hasL){
      remote[k]=deepClone(local[k]);
      return
    }
    if(hasB&&hasL&&!sameJSON(base[k],local[k])){
      remote[k]=deepClone(local[k])
    }
  });
  return remote
}
function mergeLocalDelta(basePayload,localPayload,remotePayload){
  const base=basePayload||{casts:[],clients:[],staff:[],reservations:[],tables:{}};
  const local=localPayload||syncPayload();
  const remote=remotePayload||{casts:[],clients:[],staff:[],reservations:[],tables:{}};

  return {
    initialized:true,
    casts:mergeIdArray(base.casts,local.casts,remote.casts),
    clients:mergeIdArray(base.clients,local.clients,remote.clients),
    staff:mergeIdArray(base.staff,local.staff,remote.staff),
    reservations:mergeIdArray(base.reservations,local.reservations,remote.reservations),
    tables:mergeTables(base.tables,local.tables,remote.tables)
  }
}
function scheduleRemoteSave(){
  clearTimeout(remoteSaveTimer);
  remoteSaveTimer=setTimeout(flushRemoteSave,180)
}
async function fetchRemoteState(){
  const {data,error}=await sb
    .from("fog_cashier_state")
    .select("id,payload,revision,updated_at")
    .eq("id",CASHIER_STATE_ID)
    .single();

  if(error)throw error;
  return data
}
async function writeRemotePayload(payload,expectedRevision){
  let q=sb
    .from("fog_cashier_state")
    .update({payload})
    .eq("id",CASHIER_STATE_ID);

  if(expectedRevision!==null&&expectedRevision!==undefined){
    q=q.eq("revision",expectedRevision)
  }

  const {data,error}=await q
    .select("id,payload,revision,updated_at")
    .maybeSingle();

  if(error)throw error;
  return data
}
async function initializeRemoteFromLocal(){
  try{
    setSyncStatus("初期化中","busy");
    const local=syncPayload();

    const row=await fetchRemoteState();
    if(row.payload?.initialized!==false){
      serverRevision=Number(row.revision||0);
      serverBase=deepClone(row.payload);
      applyRemotePayload(row.payload);
      syncReady=true;
      closeModal();
      setSyncStatus("同期","ok");
      return
    }

    const updated=await writeRemotePayload(local,row.revision);
    if(!updated)throw new Error("初期化中に別端末から更新されました");

    serverRevision=Number(updated.revision||0);
    serverBase=deepClone(updated.payload);
    localDirty=false;
    syncReady=true;

    closeModal();
    setSyncStatus("同期","ok");
    toast("リアルタイム共有を開始しました")
  }catch(error){
    console.error("initialize realtime",error);
    setSyncStatus("同期エラー","error");
    toast("共有開始に失敗しました")
  }
}
async function flushRemoteSave(){
  if(!syncReady||remoteSaveInFlight||!localDirty)return;

  remoteSaveInFlight=true;
  setSyncStatus("保存中","busy");

  try{
    for(let attempt=0;attempt<3;attempt++){
      const local=syncPayload();
      const base=deepClone(serverBase||local);
      const expected=serverRevision;

      const updated=await writeRemotePayload(local,expected);

      if(updated){
        serverRevision=Number(updated.revision||0);
        serverBase=deepClone(updated.payload);

        if(sameJSON(syncPayload(),local)){
          localDirty=false
        }else{
          localDirty=true
        }

        queuedRemoteRow=null;
        setSyncStatus("同期","ok");
        if(!realtimeSubscribed)startFallbackPolling();
        if(localDirty)scheduleRemoteSave();
        return
      }

      // Revision conflict: keep our local changes, merge them over the latest
      // server state, then retry against the latest revision.
      const latest=await fetchRemoteState();
      const currentLocal=syncPayload();
      const merged=mergeLocalDelta(base,currentLocal,latest.payload);

      serverRevision=Number(latest.revision||0);
      serverBase=deepClone(latest.payload);

      const localHistory=db.history||[];
      db=Object.assign(defaultDB(),deepClone(merged));
      db.history=localHistory;
      persistLocalOnly();
      renderAll();

      const retry=await writeRemotePayload(merged,serverRevision);
      if(retry){
        serverRevision=Number(retry.revision||0);
        serverBase=deepClone(retry.payload);
        localDirty=false;
        queuedRemoteRow=null;
        setSyncStatus("同期","ok");
        if(!realtimeSubscribed)startFallbackPolling();
        return
      }
    }

    throw new Error("Realtime revision conflict")
  }catch(error){
    console.error("remote save",error);
    localDirty=true;
    setSyncStatus("再接続待ち","error");
    setTimeout(()=>{
      if(syncReady)scheduleRemoteSave()
    },1500)
  }finally{
    remoteSaveInFlight=false
  }
}
function handleRealtimeRow(row){
  if(!row||row.id!==CASHIER_STATE_ID)return;

  const rev=Number(row.revision||0);
  if(serverRevision!==null&&rev<=serverRevision)return;

  if(localDirty||remoteSaveInFlight){
    queuedRemoteRow=row;
    // Our optimistic write will detect the new revision and merge.
    if(localDirty)scheduleRemoteSave();
    return
  }

  serverRevision=rev;
  serverBase=deepClone(row.payload);

  if(row.payload?.initialized!==false){
    applyRemotePayload(row.payload);
    syncReady=true;
    setSyncStatus("同期","ok")
  }
}
async function fetchRemoteRevision(){
  const {data,error}=await sb
    .from("fog_cashier_state")
    .select("revision")
    .eq("id",CASHIER_STATE_ID)
    .single();
  if(error)throw error;
  return Number(data.revision||0)
}
async function fallbackPollOnce(){
  if(!syncReady||document.hidden||localDirty||remoteSaveInFlight)return;
  try{
    const rev=await fetchRemoteRevision();
    if(serverRevision===null||rev>serverRevision){
      const row=await fetchRemoteState();
      handleRealtimeRow(row)
    }
    if(!realtimeSubscribed)setSyncStatus("同期","ok")
  }catch(error){
    console.error("fallback poll",error);
    lastSyncError=syncErrorText(error);
    setSyncStatus("通信待ち","error")
  }
}
function startFallbackPolling(){
  stopFallbackPolling();
  fallbackPollTimer=setInterval(fallbackPollOnce,FALLBACK_POLL_MS);
  fallbackPollOnce()
}
function stopFallbackPolling(){
  if(fallbackPollTimer){
    clearInterval(fallbackPollTimer);
    fallbackPollTimer=null
  }
}
function scheduleRealtimeRetry(){
  clearTimeout(realtimeRetryTimer);
  if(realtimeSubscribed||!syncReady)return;
  realtimeRetryTimer=setTimeout(async()=>{
    if(!syncReady||realtimeSubscribed)return;
    try{
      await subscribeRealtime();
    }catch(e){}
    if(!realtimeSubscribed)scheduleRealtimeRetry()
  },REALTIME_RETRY_MS)
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)return;
  if(syncReady)fallbackPollOnce()
});

async function subscribeRealtime(){
  if(realtimeChannel){
    try{await sb.removeChannel(realtimeChannel)}catch(e){}
    realtimeChannel=null
  }

  realtimeSubscribed=false;

  return await new Promise(resolve=>{
    let settled=false;
    const finish=ok=>{
      if(settled)return;
      settled=true;
      clearTimeout(timeout);
      resolve(ok)
    };

    const timeout=setTimeout(()=>{
      realtimeSubscribed=false;
      startFallbackPolling();
      scheduleRealtimeRetry();
      finish(false)
    },7000);

    realtimeChannel=sb
      .channel("fog-cashier-main")
      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"fog_cashier_state",
          filter:`id=eq.${CASHIER_STATE_ID}`
        },
        payload=>handleRealtimeRow(payload.new)
      )
      .subscribe((status,error)=>{
        if(status==="SUBSCRIBED"){
          realtimeSubscribed=true;
          lastSyncError="";
          stopFallbackPolling();
          if(syncReady)setSyncStatus("同期","ok");
          finish(true)
        }else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){
          console.error("realtime channel",status,error);
          realtimeSubscribed=false;
          lastSyncError=error?syncErrorText(error):status;
          if(syncReady){
            startFallbackPolling();
            scheduleRealtimeRetry();
            setSyncStatus("同期","ok")
          }
          finish(false)
        }
      })
  })
}
async function connectRealtimeSync(){
  if(syncConnecting)return;
  syncConnecting=true;
  setSyncStatus("接続中","busy");

  try{
    const {data:{session},error:sessionError}=await sb.auth.getSession();
    if(sessionError)throw sessionError;
    if(!session){
      syncReady=false;
      showSyncLogin();
      return
    }

    const {data:userData,error:userError}=await sb.auth.getUser();
    if(userError)throw userError;

    currentAuthEmail=userData.user?.email||session.user?.email||"";
    if(session.access_token){
      await sb.realtime.setAuth(session.access_token)
    }
    hideSyncLogin();

    // REST database access is the source of truth.
    // Once this succeeds, the device is considered connected.
    const row=await fetchRemoteState();

    serverRevision=Number(row.revision||0);
    serverBase=deepClone(row.payload);

    if(row.payload?.initialized===false){
      syncReady=false;
      setSyncStatus("初期化待ち","busy");
      showInitialSyncPrompt();
      return
    }

    applyRemotePayload(row.payload);
    localDirty=false;
    syncReady=true;
    lastSyncError="";
    setSyncStatus("同期","ok");

    // Try websocket Realtime. If it fails on this device/network,
    // keep the app online using a tiny revision-only poll every 3 sec.
    const rtOK=await subscribeRealtime();
    if(!rtOK){
      startFallbackPolling();
      scheduleRealtimeRetry();
      setSyncStatus("同期","ok")
    }
  }catch(error){
    console.error("connect realtime",error);
    syncReady=false;
    realtimeSubscribed=false;
    lastSyncError=syncErrorText(error);
    setSyncStatus("接続エラー","error");
    toast("接続エラー："+lastSyncError)
  }finally{
    syncConnecting=false
  }
}
async function bootstrapRealtime(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){
      showSyncLogin();
      return
    }
    currentAuthEmail=session.user?.email||"";
    hideSyncLogin();
    await connectRealtimeSync()
  }catch(error){
    console.error("bootstrap realtime",error);
    lastSyncError=syncErrorText(error);
    setSyncStatus("接続エラー","error");
    showSyncLogin()
  }
}

    const key=h.dataset.table,ov=document.getElementById("ov-"+key),s=db.tables[key];

    if(!s)return;

    if(s.state==="cleaning"){
      ov.classList.add("cleaning");
      ov.innerHTML='<div class="cleantext">バッシング中</div>';
      return
    }

    ov.classList.add(s.state==="check"?"check":"occupied");

    const type=sessionType(s);
    const casts=sessionCastNames(s);
    const entries=sessionClientEntries(s);
    const fieldNames=getFieldAssignments(s).map(a=>castById(a.castId)?.name).filter(Boolean);

    const topLine=type==="new"
      ? ((s.route||"来店経緯未設定")+(fieldNames.length?"｜"+fieldNames.join("・"):""))
      : type==="trial"
        ? "体験"
        : type==="industry"
          ? ("同業｜"+(casts.join("・")||"—"))
          : (casts.join("・")||"—");

    const clientsHtml=entries.length
      ? entries.map(entry=>{
          const def=CATEGORY_DEFS[entry.category]||CATEGORY_DEFS.none;
          const cls=entry.category==="none"?"":def.cls;
          return '<span class="client-chip '+cls+'">'+esc(entry.name)+'</span>'
        }).join("")
      : '<span class="client-chip">'+esc("—")+'</span>';

    ov.innerHTML=
      '<div class="names-block">'+
        '<div class="cast-line">'+esc(topLine)+'</div>'+
        '<div class="client-list-line">'+clientsHtml+'</div>'+
      '</div>'+
      '<div class="table-meta">'+
        '<div class="ov-time">'+esc(s.entryTime||"")+'</div>'+
        (s.crown?'<div class="crown">👑</div>':'')+
      '</div>'+
      (s.state==="check"?'<div class="bigx">×</div>':'');

  });

  requestAnimationFrame(fitTableText)
}

const RESERVATION_TIME_SLOTS=[
  "20:00","20:30","21:00","21:30","22:00","22:30",
  "23:00","23:30","24:00","24:30","前半","後半"
];
function reservationTimeOptions(selected="20:00"){
  let options=RESERVATION_TIME_SLOTS.map(v=>
    `<option value="${v}" ${v===selected?"selected":""}>${v}</option>`
  ).join("");
  if(selected&&!RESERVATION_TIME_SLOTS.includes(selected)){
    options+=`<option value="${esc(selected)}" selected>${esc(selected)}（旧設定）</option>`
  }
  return options
}
function reservationTimeRank(value){
  const i=RESERVATION_TIME_SLOTS.indexOf(value);
  return i===-1?999:i
}

function renderSchedule(){
  const byTime=(a,b)=>reservationTimeRank(a.time)-reservationTimeRank(b.time);
  const plan=db.reservations.filter(r=>r.kind==="plan"||(!r.kind)).sort(byTime);
  const comp=db.reservations.filter(r=>r.kind==="companion");
  const industry=db.reservations.filter(r=>r.kind==="industry").sort(byTime);

  const make=arr=>arr.length?arr.map(r=>{
    const cat=CATEGORY_DEFS[r.category]||CATEGORY_DEFS.none;
    const timeText=r.kind==="companion"?"同伴":esc(r.time||"");
    const companionText=r.kind==="plan"&&Number(r.companionCount||0)>0
      ? ` / お連れ様×${Number(r.companionCount)}`
      : "";
    const industryText=r.kind==="industry"
      ? ` / ${yen(r.industryFee||30000)}`
      : "";
    return `<div class="reserve">
      <div class="reserve-top"><span>${timeText}</span><span>${r.arrived?"来店済":"未来店"}</span></div>
      <div class="reserve-main">${esc(r.castName)} / ${esc(r.clientName)}</div>
      <div class="reserve-sub">区分：${esc(cat.label)}${companionText}${industryText}</div>
      <div class="reserve-actions">
        ${!r.arrived?`<button class="mini primary" onclick="chooseTableForReservation('${r.id}')">来店</button>`:""}
        <button class="mini" onclick="editReservation('${r.id}')">編集</button>
        <button class="mini" onclick="deleteReservation('${r.id}')">削除</button>
      </div>
    </div>`
  }).join(""):'<div class="empty">なし</div>';

  document.getElementById("planList").innerHTML=make(plan);
  document.getElementById("companionList").innerHTML=make(comp);
  document.getElementById("industryList").innerHTML=make(industry);
}

function saveGuide(){
  const table=document.getElementById("gTable").value;
  if(db.tables[table])return toast("使用中です");

  const type=document.getElementById("gType").value;
  const castIds=type==="new"?[]:collectDynamicValues("gCastList",".gCastDyn");
  const clientIds=(type==="new"||type==="industry")?[]:collectDynamicValues("gClientList",".gClientDyn");

  if((type==="existing"||type==="industry")&&!castIds.length)return toast("キャストを選択してください");
  if(type==="existing"&&!clientIds.length)return toast("クライアントを選択してください");

  const selectedCastSet=new Set(castIds);
  const filteredClientIds=clientIds.filter(id=>{
    const c=clientById(id);
    return c&&selectedCastSet.has(c.castId)
  });

  const companionCount=type==="existing"?Number(document.getElementById("gCompanionCount").value||0):0;
  const companionFees=type==="existing"?collectCompanionFeeInputs("g"):[];

  const newGuestCount=type==="new"?Number(document.getElementById("gNewGuestCount").value||1):0;
  const newPlan=type==="new"?(document.getElementById("gNewPlan").value||"A"):"";
  const newCampaign=type==="new"?document.getElementById("gNewCampaign").checked:false;
  const newAmount=type==="new"?Number(document.getElementById("gNewAmount").value||0):0;
  const staffId=type==="new"?document.getElementById("gNewStaff").value:"";
  const industryFee=type==="industry"?Number(document.getElementById("gIndustryFee").value||30000):0;

  snapshot("案内");

  db.tables[table]={
    type,
    baseType:type,
    castIds,
    clientIds:filteredClientIds,
    companionCount,
    companionFees,
    newGuestCount,
    fieldAssignments:[],
    entryTime:document.getElementById("gTime").value||nowBusinessHHMM(),
    route:type==="new"?document.getElementById("gRoute").value:"",
    category:type==="new"?"new":type==="industry"?"none":(document.getElementById("gCategory").value||"none"),
    crown:document.getElementById("gCrown").checked,

    newPlan,
    newCampaign,
    newAmount,
    receivedByStaffId:staffId,
    receivedByStaffName:staffById(staffId)?.name||"",
    industryFee,

    state:"occupied"
  };

  closeModal();
  saveDB()
}

      <button class="btn primary" onclick="startTableMove('${table}')">はい</button>

function startTableMove(table){
  moveMode={from:table};
  closeModal();
  toast("移動先の卓をタップしてください")
}
function handleTableTap(table){
  if(moveMode)return chooseMoveDestination(table);
  openTable(table)
}
function chooseMoveDestination(table){
  const from=moveMode?.from;
  if(!from){
    moveMode=null;
    return openTable(table)
  }
  if(table===from){
    moveMode=null;
    toast("卓移動をキャンセルしました");
    return
  }
  if(db.tables[table]){
    toast("その卓は使用中です");
    return
  }
  modal(`<h3>卓移動</h3>
    <div style="font-weight:900;font-size:16px">
      ${from==="RVIP"?"RV":from} → ${table==="RVIP"?"RV":table}
    </div>
    <div style="margin-top:8px">ここに移動しますか？</div>
    <div class="card-actions">
      <button class="btn" onclick="closeModal()">いいえ</button>
      <button class="btn primary" onclick="confirmTableMove('${table}')">はい</button>
    </div>`)
}
function confirmTableMove(to){
  const from=moveMode?.from;
  if(!from||!db.tables[from]||db.tables[to]){
    moveMode=null;
    closeModal();
    return toast("卓移動できませんでした")
  }

  const s=db.tables[from];
  const movedAt=nowBusinessHHMM();

  snapshot("卓移動");

  if(!Array.isArray(s.seatHistory)||!s.seatHistory.length){
    s.seatHistory=[{
      table:from,
      from:s.entryTime||"",
      to:""
    }]
  }

  const last=s.seatHistory[s.seatHistory.length-1];
  if(last&&!last.to)last.to=movedAt;
  s.seatHistory.push({table:to,from:movedAt,to:""});

  s.moveHistory=Array.isArray(s.moveHistory)?s.moveHistory:[];
  s.moveHistory.push({from,to,time:movedAt});

  db.tables[to]=s;
  delete db.tables[from];

  moveMode=null;
  closeModal();
  saveDB();
  toast(`${from==="RVIP"?"RV":from} → ${to==="RVIP"?"RV":to} に移動しました`)
}

function confirmFieldExtension(table,assignmentId){
  const s=db.tables[table];
  if(!s)return;
  const fields=getFieldAssignments(s);
  const a=fields.find(x=>x.id===assignmentId);
  if(!a||!needsFieldRecheck(a.plan))return;

  snapshot("場内再延長確認");
  const base=a.nextCheckTime||addMinutesHHMM(a.startTime,60)||nowHHMM();
  a.nextCheckTime=addMinutesHHMM(base,60);
  s.fieldAssignments=fields;

  persistLocal();
  openTable(table);
  toast("再延長確認を更新しました")
}

function saveFieldConvert(table){
  const s=db.tables[table];
  if(!s)return;
  if(remainingFieldSlots(s)<=0)return toast("場内にできる人数の上限です");

  const castId=document.getElementById("fieldCast").value;
  if(!castId)return toast("キャストを選択してください");

  const plan=Number(document.getElementById("fieldPlan").value||0);
  if(!plan)return toast("場内プランを選択してください");

  const startTime=document.getElementById("fieldStart").value||nowBusinessHHMM();

  snapshot("場内追加");

  const fields=getFieldAssignments(s);
  fields.push({
    id:uid("field"),
    castId,
    plan,
    startTime,
    nextCheckTime:needsFieldRecheck(plan)?addMinutesHHMM(startTime,60):""
  });

  s.baseType=sessionType(s);
  s.type=s.baseType;

  s.fieldPlan=0;

}

function saveCurrentTableEdit(table){
  const s=db.tables[table];
  if(!s)return;

  const type=document.getElementById("editType").value;
  const castIds=type==="new"?[]:collectDynamicValues("editCastList",".editCastDyn");
  const clientIds=(type==="new"||type==="industry")?[]:collectDynamicValues("editClientList",".editClientDyn");

  if((type==="existing"||type==="industry")&&!castIds.length)return toast("キャストを選択してください");
  if(type==="existing"&&!clientIds.length)return toast("クライアントを選択してください");

  const selectedCastSet=new Set(castIds);
  const filteredClientIds=clientIds.filter(id=>{
    const c=clientById(id);
    return c&&selectedCastSet.has(c.castId)
  });

  const oldFields=getFieldAssignments(s);
  const companionCount=type==="existing"?Number(document.getElementById("editCompanionCount").value||0):0;
  const companionFees=type==="existing"?collectCompanionFeeInputs("edit"):[];
  const newGuestCount=type==="new"?Number(document.getElementById("editNewGuestCount").value||1):0;
  const newCapacity=type==="new"?newGuestCount:type==="existing"?companionCount:0;

  if(oldFields.length>newCapacity){
    return toast(`場内が${oldFields.length}名いるため、人数を${oldFields.length}名未満にはできません`)
  }

  snapshot("卓情報修正");

  s.type=type;
  s.baseType=type;
  s.castIds=castIds;
  s.clientIds=filteredClientIds;
  s.companionCount=companionCount;
  s.companionFees=companionFees;
  s.newGuestCount=newGuestCount;
  s.fieldAssignments=oldFields;
  s.entryTime=document.getElementById("editTableTime").value||s.entryTime;
  s.category=type==="new"?"new":type==="industry"?"none":(document.getElementById("editCategory").value||"none");
  s.industryFee=type==="industry"?Number(document.getElementById("editIndustryFee").value||30000):0;
  s.crown=document.getElementById("editCrown").checked;

  if(type==="new"){
    s.route=document.getElementById("editRoute").value||"";
    s.newPlan=document.getElementById("editNewPlan").value||"A";
    s.newCampaign=document.getElementById("editNewCampaign").checked;
    s.newAmount=Number(document.getElementById("editNewAmount").value||0);
    s.receivedByStaffId=document.getElementById("editNewStaff").value||"";
    s.receivedByStaffName=staffById(s.receivedByStaffId)?.name||"";
  }else{
    s.route="";
  }

  // Legacy fields clear
  s.castId=null;s.castId2=null;s.castName="";s.castName2="";
  s.clientId=null;s.clientId2=null;s.clientName="";s.clientName2="";
  s.classification="";
  s.companion=false;
  s.quick=false;s.glow=false;s.gold=false;s.black=false;
  s.companionField=false;s.companionFieldCastId=null;s.companionFieldCastName="";
  s.fieldPlan=0;s.fieldStartTime="";s.fieldNextCheckTime="";

  closeModal();
  saveDB();
  toast("卓情報を修正しました")
}

}
function reservationKindChanged(){
  const kind=document.getElementById("rKind").value;
  document.getElementById("rTimeWrap").style.display=kind==="companion"?"none":"grid";
  document.getElementById("rCompanionWrap").style.display=kind==="plan"?"grid":"none";
  document.getElementById("rIndustryWrap").style.display=kind==="industry"?"grid":"none";
  document.getElementById("rClientWrap").style.display=kind==="industry"?"none":"grid";
  document.getElementById("rNameWrap").style.display=kind==="industry"?"none":"grid"
}
function refreshRClients(){document.getElementById("rClient").innerHTML=clientOptions(document.getElementById("rCast").value)}
function saveReservation(id){
  const castId=document.getElementById("rCast").value;
  const clientId=document.getElementById("rClient").value;
  const typed=document.getElementById("rName").value.trim();
  const c=clientById(clientId);
  const cast=castById(castId);
  const kind=document.getElementById("rKind").value;

  if(!castId)return toast("キャストを選択してください");
  if(kind!=="industry"&&!clientId&&!typed)return toast("クライアントを入力してください");

  snapshot(id?"予定編集":"予定登録");

  const obj={
    id:id||uid("r"),
    kind,
    time:kind==="companion"?"":document.getElementById("rTime").value,
    category:document.getElementById("rCategory").value||"none",
    companionCount:kind==="plan"?Number(document.getElementById("rCompanionCount").value||0):0,
    industryFee:kind==="industry"?Number(document.getElementById("rIndustryFee").value||30000):0,
    castId,
    castName:cast.name,
    clientId:kind==="industry"?null:(clientId||null),
    clientName:kind==="industry"?"同業":(c?.name||typed),
    arrived:rArrived(id)
  };

  if(id){
    const i=db.reservations.findIndex(x=>x.id===id);
    db.reservations[i]=obj
  }else{
    db.reservations.push(obj)
  }

  closeModal();
  saveDB()
}
function rArrived(id){return id?(db.reservations.find(x=>x.id===id)?.arrived||false):false}
function editReservation(id){openReservation(id)}
function deleteReservation(id){snapshot("予定削除");db.reservations=db.reservations.filter(r=>r.id!==id);saveDB()}
function chooseTableForReservation(id){
  const r=db.reservations.find(x=>x.id===id);if(!r)return;
  const empty=Object.keys(BOXES).filter(k=>!db.tables[k]);
  modal(`<h3>${esc(r.castName)} / ${esc(r.clientName)}</h3><div class="field"><label>案内卓</label><select id="arriveTable">${empty.map(k=>`<option value="${k}">${k==="RVIP"?"RV":k}</option>`).join("")}</select></div><div class="card-actions"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" onclick="assignReservation('${id}')">来店→卓へ</button></div>`)
}
function assignReservation(id){
  const r=db.reservations.find(x=>x.id===id);
  const table=document.getElementById("arriveTable").value;
  if(!r||!table)return;

  snapshot("予定客来店");

  const isIndustry=r.kind==="industry";

  db.tables[table]={
    type:isIndustry?"industry":"existing",
    baseType:isIndustry?"industry":"existing",
    castIds:r.castId?[r.castId]:[],
    clientIds:isIndustry?[]:(r.clientId?[r.clientId]:[]),
    companionCount:r.kind==="plan"?Number(r.companionCount||0):0,
    companionFees:r.kind==="plan"?Array.from({length:Number(r.companionCount||0)},()=>3000):[],
    newGuestCount:0,
    fieldAssignments:[],
    entryTime:nowBusinessHHMM(),
    category:isIndustry?"none":(r.category||"none"),
    industryFee:isIndustry?Number(r.industryFee||30000):0,
    crown:false,
    state:"occupied"
  };

  r.arrived=true;
  closeModal();
  switchScreen("board");
  saveDB()
}

function openTrialTablePicker(){
  const empty=Object.keys(BOXES).filter(k=>!db.tables[k]);
  if(!empty.length)return toast("空き卓がありません");

  modal(`<h3>体験</h3>
    <div class="field">
      <label>卓番</label>
      <select id="trialTable">
        ${empty.map(k=>`<option value="${k}">${k==="RVIP"?"RV":k}</option>`).join("")}
      </select>
    </div>
    <div class="card-actions">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn primary" onclick="saveTrialTable()">反映</button>
    </div>`)
}
function saveTrialTable(){
  const table=document.getElementById("trialTable").value;
  if(!table||db.tables[table])return toast("卓を設定できません");

  snapshot("体験卓設定");

  db.tables[table]={
    type:"trial",
    baseType:"trial",
    castIds:[],
    clientIds:[],
    companionCount:0,
    companionFees:[],
    newGuestCount:0,
    fieldAssignments:[],
    entryTime:nowBusinessHHMM(),
    category:"none",
    crown:false,
    state:"occupied"
  };

  closeModal();
  saveDB();
  toast(`${table==="RVIP"?"RV":table} に体験を反映しました`)
}

function showCheck(){const rows=Object.entries(db.tables).filter(([k,s])=>s&&(s.state==="check"||s.state==="cleaning"));modal(`<h3>CHECK / バッシング</h3>${rows.length?rows.map(([k,s])=>`<div class="reserve"><div class="reserve-main">${k==="RVIP"?"RV":k} / ${s.state==="cleaning"?"バッシング中":esc(castName(s))}</div></div>`).join(""):'<div class="empty">なし</div>'}<div class="card-actions"><button class="btn" onclick="closeModal()">閉じる</button></div>`)}

function switchScreen(name){
  currentScreen=name;
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.getElementById(name==="board"?"boardScreen":"scheduleScreen").classList.add("active");
  document.querySelector(`.tab[data-screen="${name}"]`).classList.add("active");
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>switchScreen(t.dataset.screen));
document.querySelectorAll(".hotspot").forEach(h=>h.onclick=()=>handleTableTap(h.dataset.table));
document.getElementById("guideBtn").onclick=()=>openGuide();
document.getElementById("reserveBtn").onclick=()=>openReservation();
document.getElementById("trialBtn").onclick=openTrialTablePicker;
document.getElementById("checkBtn").onclick=showCheck;
document.getElementById("masterBtn").onclick=openMaster;
document.getElementById("undoBtn").onclick=undo;
document.getElementById("shareBtn").onclick=()=>openSyncPanel();

function tick(){document.getElementById("clock").textContent=nowHHMM()}tick();setInterval(tick,15000);
renderAll();
bootstrapRealtime();
</script>
</body>
</html>
