<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SWAMP FOG CASHIER Ver.40</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
#loading{height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#222}
</style>
</head>
<body>
<div id="loading">SWAMP FOG CASHIER Ver.40 読み込み中…</div>
<script>
(async()=>{
  try{
    const cacheBust=Date.now();
    const sourceUrl="https://raw.githubusercontent.com/SWAMPFOG/fog-cashier/2e75a08f27775fa5d3c5e1b2b574928509dc09dc/index.html";
    const partUrls=[1,2,3,4,5,6,7].map(n=>`https://raw.githubusercontent.com/SWAMPFOG/fog-cashier/main/v40/floor${n}.txt?v=${cacheBust}`);

    const [sourceRes,...partRes]=await Promise.all([
      fetch(sourceUrl,{cache:"no-store"}),
      ...partUrls.map(url=>fetch(url,{cache:"no-store"}))
    ]);
    if(!sourceRes.ok)throw new Error("本体取得 "+sourceRes.status);
    partRes.forEach((res,i)=>{if(!res.ok)throw new Error(`卓表区分データ${i+1}取得 ${res.status}`)});

    let html=await sourceRes.text();
    const parts=await Promise.all(partRes.map(res=>res.text()));
    const base64=parts.map(v=>v.trim()).join("");
    if(base64.length!==39316||!base64.startsWith("/9j/"))throw new Error("卓表区分データが不完全です");
    const patchData="data:image/jpeg;base64,"+base64;

    const replaceOnce=(from,to)=>{
      if(!html.includes(from))throw new Error("更新箇所が見つかりません");
      html=html.replace(from,to);
    };

    replaceOnce('<meta name="fog-cashier-version" content="38">','<meta name="fog-cashier-version" content="40">');
    replaceOnce('<title>SWAMP FOG CASHIER v38 REALTIME</title>','<title>SWAMP FOG CASHIER v40 REALTIME</title>');
    replaceOnce('<span class="app-ver">Ver.38</span>','<span class="app-ver">Ver.40</span>');
    replaceOnce('const APP_VERSION="38";','const APP_VERSION="40";');

    const floorImgPattern=/(<img id="floorImg" src="[^"]+" alt="SWAMP FOG 卓表 Ver\.38">)/;
    if(!floorImgPattern.test(html))throw new Error("卓表画像の位置が見つかりません");

    html=html.replace(floorImgPattern,(m)=>
      m.replace('Ver.38','Ver.40')+
      `<img id="floorPatch40" src="${patchData}" alt="" aria-hidden="true" style="position:absolute;left:73.484848%;top:10.942761%;width:24.090909%;height:25.533109%;object-fit:fill;pointer-events:none;user-select:none;z-index:1">`
    );

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.getElementById("loading").textContent="読み込みエラー："+e.message;
  }
})();
</script>
</body>
</html>
